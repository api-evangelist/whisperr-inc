    method: POST
    path: /v1/events/track
    description: Record a single churn-signal event for a user.
    consequence: write
    note: >-
      Requires context.$message_id for idempotency. The caller must generate it
      once per event and reuse it across retries.
  - name: track_event_batch
    rest: trackEventBatch
    method: POST
    path: /v1/events/batch
    description: Record up to 500 churn-signal events in one request.
    consequence: write
    note: Preferred over track_event. A single malformed event fails the whole batch with a 400.
  - name: identify_user
    rest: identifyUser
    method: POST
    path: /v1/identify
    description: >-
      Set or merge a user's traits and contact channels (email / sms / push),
      including opt-in state.
    consequence: write
    note: >-
      Idempotent and safe to call repeatedly; traits merge server-side. Carries
      consent data (opted_in), so it is the most sensitive of the ingestion tools.
