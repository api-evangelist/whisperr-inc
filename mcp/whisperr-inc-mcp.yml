  - name: preview_decision
    rest: previewDecision
    method: POST
    path: /v1/decisions/preview
    description: >-
      Preview which intervention the decisioning engine would select, without
      dispatching it.
    consequence: read
    note: >-
      Effectively a dry-run surface — it evaluates the policy without delivering
      a message to an end user. The safest entry point for an agent exploring
      Whisperr's behavior.
