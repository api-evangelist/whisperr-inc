pii:
  note: >-
    Derived, and material for a buyer's review. The identify surface ingests
    direct end-user identifiers — email addresses, E.164 phone numbers and push
    tokens — plus free-form traits and an explicit opt-in/consent flag per
    channel. Combined with the absence of any published compliance program,
    trust center, security.txt or DPA reference (see
    conformance/whisperr-inc-conformance.yml), this is the highest-value gap in
    the profile.
  fields:
  - IngestedUserChannel.address (email / phone / push token)
  - IngestedUserChannel.opted_in (consent)
  - DashboardUser traits (free-form, caller-supplied)
  - TrackEventRequest.properties (free-form, caller-supplied)

