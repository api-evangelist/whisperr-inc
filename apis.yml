aid: whisperr-inc
name: Whisperr, Inc.
description: >-
  Whisperr, Inc. builds an autonomous customer-retention platform that detects
  churn risk and acts on it automatically, without a lifecycle marketing team
  operating campaigns. Whisperr combines behavioral intelligence, autonomous
  decisioning, and AI-generated content to spot at-risk customers and deliver
  interventions in under ten seconds. It serves SaaS, DTC and
  subscription-commerce, and mobile-game businesses, and publishes churn
  calculators plus a voice retention agent (Whisperr Recall). Whisperr is a 500
  Global portfolio company. It publishes a real developer surface: an OpenAPI
  3.0.3 document served at https://api.whisperr.net/openapi.json, a documented
  three-endpoint ingestion API (track, batch, identify) authenticated with a
  publishable wrk_ key, ten first-party SDKs spanning JavaScript, Python, PHP,
  .NET, Dart and Swift, an agentic integration CLI (npx @whisperr/wizard), and a
  public wire-contract repository whose executable conformance fixtures every SDK
  runs in CI.
