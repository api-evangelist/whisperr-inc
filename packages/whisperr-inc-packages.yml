conformance_suite:
  repository: https://github.com/WhisperrAI/whisperr-spec
  note: >-
    Every SDK above runs against shared executable fixtures in CI —
    conformance/wire.json (serialized request bodies), conformance/behavior.json
    (retry/drop/retain outcomes) and conformance/push.json (push-token capture
    flows for the mobile SDKs). SDK tests default to the fixtures published at
    raw.githubusercontent.com, so a third-party client can verify against the
    same ground truth.
