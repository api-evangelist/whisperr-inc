schemes:
- name: APIKey
  type: apiKey
  in: header
  parameter: Authorization
  alternate_parameter: X-API-Key
  key_prefix: wrk_
  publishable: true
  description: >-
    App ingestion key. Either `X-API-Key: wrk_...` or `Authorization: Bearer
